// Logs to C:\launch-matrix\windows-opened.txt on Windows, and /tmp/windows-opened.txt elsewhere, each window Firefox
// opens, with the JavaScript stack which opened it, its address and arguments once loaded, and when it is activated
// and deactivated, and the notifications of Firefox's start and session restore, for telling which code opens and
// focuses Firefox's windows when it starts.
try {
  const append = text => {
    const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    file.initWithPath(Services.appinfo.OS == "WINNT" ? "C:\\launch-matrix\\windows-opened.txt" : "/tmp/windows-opened.txt");
    const stream = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
    // Write, create and append.
    stream.init(file, 0x02 | 0x08 | 0x10, 0o644, 0);
    const converter = Cc["@mozilla.org/intl/converter-output-stream;1"].createInstance(Ci.nsIConverterOutputStream);
    converter.init(stream, "UTF-8");
    converter.writeString(text + "\n");
    converter.close();
  };
  const stack = () => {
    const lines = [];
    for (let frame = Components.stack.caller; frame; frame = frame.caller) {
      lines.push("    " + frame.name + " " + frame.filename + ":" + frame.lineNumber);
    }
    return lines.join("\n");
  };
  append("== " + new Date().toISOString() + " " + Services.appinfo.processID);
  Services.obs.addObserver({
    observe(subject, topic) {
      append(Date.now() + " " + topic + "\n" + stack());
      subject.addEventListener("load", () => {
        const args = [];
        try {
          for (const arg of subject.arguments || []) {
            args.push(arg instanceof Ci.nsISupportsString ? arg.data : String(arg));
          }
        } catch (error) {
          args.push(String(error));
        }
        append(Date.now() + " loaded " + subject.location.href + " arguments " + JSON.stringify(args));
        for (const type of ["activate", "deactivate"]) {
          subject.addEventListener(type, () => append(Date.now() + " " + type + " " + subject.document.title));
        }
      }, { once: true });
    },
  }, "domwindowopened");
  // Whether each browser window is on another virtual desktop when the session store checks it, after restoring.
  Services.obs.addObserver({
    observe() {
      const windows = [];
      for (const win of Services.wm.getEnumerator("navigator:browser")) {
        windows.push(win.document.title + (win.isCloaked ? " (cloaked)" : " (on the current desktop)"));
      }
      append(Date.now() + " at sessionstore-windows-restored: " + JSON.stringify(windows));
    },
  }, "sessionstore-windows-restored");
  // Where external links open, as the session store reads it when it restores the session at startup.
  Services.obs.addObserver({
    observe() {
      const names = ["browser.link.open_newwindow.override.external", "browser.link.open_newwindow"];
      append(Date.now() + " at final-ui-startup: " + names.map(name => name + "=" + Services.prefs.getIntPref(name, -9)).join(" "));
    },
  }, "final-ui-startup");
  for (const name of ["command-line-startup", "final-ui-startup", "sessionstore-windows-restored", "browser-delayed-startup-finished",
                      "quit-application-requested", "quit-application-granted", "quit-application"]) {
    Services.obs.addObserver({
      observe(subject, topic, data) {
        append(Date.now() + " " + topic + " " + (data || ""));
      },
    }, name);
  }
} catch (error) {
  // An error of autoconfig would stop Firefox's start with a dialog.
}
