name: matrix

on:
  push:
    paths:
      - matrix/**
      - .github/workflows/matrix.yml
  workflow_dispatch:

jobs:
  scenario:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
        build: ["161.0", "162.0b1"]
        scenario: [A, B1, B2, C, D1, D2, E, F]
        # Each scenario runs twice, as the window which ends up with the focus can differ between runs.
        run: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the scenario
        env:
          BUILD: ${{ matrix.build }}
        run: matrix/matrix.sh firefox ${{ matrix.scenario }} out
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-${{ matrix.build }}-${{ matrix.scenario }}-${{ matrix.runner }}-${{ matrix.run }}
          path: out
