name: gtk

# What GTK's macOS backend shows in the macOS menu bar for a GTK 4 application with a menu bar, and for applications
# with only a header bar and its primary menu, as GNOME applications have, with GTK and with libadwaita (gtk/run.sh),
# each in a job of its own.
on:
  push:
    paths:
      - gtk/**
      - .github/workflows/gtk.yml
  workflow_dispatch:

jobs:
  menubar:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
        variant: [menubar, primary, adw]
        # GTK's renderer: the default one, or cairo, which renders without the GPU.
        renderer: [default, cairo]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the application
        env:
          RENDERER: ${{ matrix.renderer }}
        run: gtk/run.sh ${{ matrix.variant }} out
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-${{ matrix.variant }}-${{ matrix.renderer }}-${{ matrix.runner }}
          path: out
