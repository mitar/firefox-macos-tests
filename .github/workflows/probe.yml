name: probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: probe/probe.sh out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.runner }}
          path: out
