name: probe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: probe/probe.sh out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.runner }}
          path: out
      # Artifacts need a token with the actions scope to download, so the results also go to a branch of their own.
      - name: Push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="results/${{ github.run_id }}-${{ matrix.runner }}"
          git checkout -q --orphan "$branch"
          git rm -rq --cached .
          git add -f out
          git commit -qm "Probe results of ${{ matrix.runner }}, run ${{ github.run_id }}."
          git push -q origin "$branch"
